[package]
name = "key-reset-follow"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "641f43b3030b1c68961e05d525e58ec6f4264a15", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }

[[example]]
name = "fault-proxy"
path = "tests/support/fault_proxy.rs"

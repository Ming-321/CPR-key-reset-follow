[package]
name = "key-reset-follow"
version = "0.1.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "402bc37fbb5c83378cc83cec89e9fa251e4a99c1", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }

[[example]]
name = "fault-proxy"
path = "tests/support/fault_proxy.rs"
